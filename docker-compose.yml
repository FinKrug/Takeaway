services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: takeaway-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=takeaway-cluster
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: takeaway-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: takeaway_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: takeaway-app
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      PHX_SERVER: "true"
      DATABASE_URL: "ecto://postgres:postgres@postgres:5432/takeaway_dev"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      SECRET_KEY_BASE: "VpFTzOqxpyi+Erwc0qdSV1LiYxyfs2PksHqJRHfNEDlDhXgp5XpkvQLJdg6/4NKq"
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
