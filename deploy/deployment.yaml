apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line when you turn on the HPA (examples/hpa), or Argo CD and
  # the autoscaler will keep resetting each other.
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      # Run Ecto migrations before the app starts. Until the database is up,
      # this fails and Kubernetes retries it; the old pods keep serving.
      initContainers:
        - name: migrate
          image: app
          command: ["/app/bin/migrate"]
          env:
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: secret-key-base
            # Made by the CloudNativePG operator for Cluster db (deploy/db.yaml).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: uri
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: uri
            - name: POOL_SIZE
              value: "5"
            - name: TEAM_NAME
              value: "takeaway"
            - name: PHX_HOST
              value: "takeaway.cnh.radarhq.io"
            # Phoenix signs cookies with this. It lives in a Secret created
            # outside git (examples/agent-workflows/README.md): the repo is public.
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: secret-key-base
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
