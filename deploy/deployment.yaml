apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line when you turn on the HPA, or Argo CD and
  # the autoscaler will keep resetting each other.
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      # Run Ecto migrations before the app starts. Until the database is up,
      # this fails and Kubernetes retries it; the old pods keep serving.
      initContainers:
        - name: migrate
          image: app
          command: ["/app/bin/migrate"]
          env:
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: secret-key-base
            # Made by the CloudNativePG operator for Cluster db (deploy/db.yaml).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: uri
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: uri
            - name: POOL_SIZE
              value: "5"
            - name: ELASTICSEARCH_URL
              value: "http://elasticsearch:9200"
            - name: TEAM_NAME
              value: "takeaway"
            - name: PHX_HOST
              value: "takeaway.cnh.radarhq.io"
            # Phoenix signs cookies with this. It lives in a Secret created
            # outside git (examples/agent-workflows/README.md): the repo is public.
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: secret-key-base
            # Traces to Dash0 (config/runtime.exs). Optional: until key
            # dash0-auth-token exists in Secret app-credentials (created outside
            # git, see examples/agent-workflows/README.md), the app runs untraced.
            - name: DASH0_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: dash0-auth-token
                  optional: true
            - name: OTEL_SERVICE_NAME
              value: "takeaway"
            # Lets Dash0 match traces to the Kubernetes pod they came from.
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=hackathon,k8s.namespace.name=team-takeaway,k8s.deployment.name=app,k8s.pod.name=$(K8S_POD_NAME),k8s.pod.uid=$(K8S_POD_UID)"
            # In-cluster Whisper small (deploy/whisper.yaml). Same namespace,
            # so the short Service name resolves. No API key: speaches is open
            # inside the cluster.
            - name: STT_URL
              value: http://whisper:8000/v1/audio/transcriptions
            - name: STT_MODEL
              value: Systran/faster-whisper-small
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
