# Self-hosted differences for the app Deployment (strategic merge: env and
# containers merge by name).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  # One pod: the k3d cluster shares a server with production apps.
  replicas: 1
  # deploy/ rolls with maxSurge 0 / maxUnavailable 1 to fit the hackathon CPU
  # quota. With one replica that stops the only pod before its replacement is
  # ready (502s on take-away.dev during every deploy). This cluster has no
  # quota: start the new pod first and keep the old one until it's ready.
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      containers:
        - name: app
          env:
            # Public hostname (Apache on the server -> 127.0.0.1:8180, behind
            # Cloudflare). LiveView only accepts sockets from this host, so the
            # SSH tunnel (localhost:8180) no longer gets a live connection.
            - name: PHX_HOST
              value: "take-away.dev"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=self-hosted,k8s.namespace.name=team-takeaway,k8s.deployment.name=app,k8s.pod.name=$(K8S_POD_NAME),k8s.pod.uid=$(K8S_POD_UID)"
            - name: STT_MODEL
              value: Systran/faster-whisper-base
