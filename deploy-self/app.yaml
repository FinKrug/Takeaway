# Self-hosted differences for the app Deployment (strategic merge: env and
# containers merge by name).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  # One pod: the k3d cluster shares a server with production apps.
  replicas: 1
  template:
    spec:
      containers:
        - name: app
          env:
            # LiveView only accepts sockets from this host. localhost works
            # through the SSH tunnel; change it when the app gets a hostname.
            - name: PHX_HOST
              value: "localhost"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=self-hosted,k8s.namespace.name=team-takeaway,k8s.deployment.name=app,k8s.pod.name=$(K8S_POD_NAME),k8s.pod.uid=$(K8S_POD_UID)"
            - name: STT_MODEL
              value: Systran/faster-whisper-base
